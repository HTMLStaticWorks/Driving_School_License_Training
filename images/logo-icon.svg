<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="60%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#006A6A"/>
    </linearGradient>
    
    <!-- Accent Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>

    <!-- Teal Glow Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A6A6"/>
      <stop offset="100%" stop-color="#5BD9D8"/>
    </linearGradient>

    <!-- Metallic Car Body -->
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Glass Tint -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base (Squircle / Shield Badge) -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
  
  <!-- Outer Accent Border Ring -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="none" stroke="url(#orangeGrad)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Dynamic Road Curve / Motion Trail -->
  <path d="M 12 78 C 32 78, 42 66, 88 66" fill="none" stroke="url(#orangeGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 22 84 C 42 84, 52 74, 88 74" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Steering Wheel Arc background accent -->
  <path d="M 50 20 A 30 30 0 0 1 76 35" fill="none" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Car Roof & Cabin -->
  <path d="M 28 54 C 33 36, 44 28, 60 28 C 72 28, 79 37, 82 54 Z" fill="url(#carGrad)"/>
  <!-- Front Windshield -->
  <path d="M 38 51 C 42 39, 49 33, 59 33 C 66 33, 71 38, 74 51 Z" fill="url(#glassGrad)"/>
  
  <!-- Car Main Chassis Body -->
  <path d="M 18 54 C 18 50, 22 48, 28 48 L 84 48 C 90 48, 94 52, 94 57 L 91 66 C 89 69, 85 70, 80 70 L 30 70 C 23 70, 19 67, 18 54 Z" fill="url(#carGrad)" filter="url(#dropShadow)"/>

  <!-- Side Accent Swoosh line on car door -->
  <path d="M 32 58 Q 55 60 76 56" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Front Headlight Beam -->
  <path d="M 88 54 L 98 52 L 98 58 Z" fill="#FF7A3D" filter="url(#glow)"/>
  <!-- Rear Taillight -->
  <path d="M 20 54 L 16 53 L 16 57 Z" fill="#EF4444" filter="url(#glow)"/>

  <!-- Front & Rear Wheels -->
  <!-- Front Wheel -->
  <circle cx="73" cy="70" r="9.5" fill="#0B132B" stroke="url(#orangeGrad)" stroke-width="2.5"/>
  <circle cx="73" cy="70" r="3.5" fill="#FFFFFF"/>
  <path d="M 73 63.5 L 73 76.5 M 66.5 70 L 79.5 70" stroke="#94A3B8" stroke-width="1"/>

  <!-- Rear Wheel -->
  <circle cx="33" cy="70" r="9.5" fill="#0B132B" stroke="url(#orangeGrad)" stroke-width="2.5"/>
  <circle cx="33" cy="70" r="3.5" fill="#FFFFFF"/>
  <path d="M 33 63.5 L 33 76.5 M 26.5 70 L 39.5 70" stroke="#94A3B8" stroke-width="1"/>
</svg>
