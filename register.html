    class="transition-colors duration-300 bg-surface text-on-surface font-body-md min-h-screen flex flex-col antialiased">

                            <span class="material-symbols-outlined icon-fill text-[32px]">directions_car</span>
                        </div>

                    </a>
                </div>
                <!-- Header -->

                    <h2
                        class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-sm">
                        Create Account</h2>
                    <p class="font-body-md text-body-md text-on-surface-variant">Register to start your premium driver
                        training.</p>
                </div>
                <!-- Form -->
                <form class="space-y-md w-full">
                    <!-- Full Name -->
                    <div class="stagger-anim anim-delay-2">
                        <label class="block font-body-sm text-body-sm text-on-surface mb-xs" for="fullName">Full
                            Name</label>

                        </div>
                    </div>
                    <!-- Email Address -->

                        </div>
                    </div>
                    <!-- Phone Number -->

                                id="phone" name="phone" placeholder="(555) 000-0000" type="tel">
                        </div>
                    </div>
                    <!-- Password -->

                        </div>

                        </div>
                    </div>

                            Create Account
                        </button>
                    </div>
                </form>
                <!-- Login Link -->

                        Already have an account?
                        <a class="font-semibold text-secondary hover:text-primary transition-colors" href="login.html">Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + '-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }
        // Simple Password Strength Demo
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strength-bar');
        const strengthText = document.getElementById('strength-text');
        passwordInput.addEventListener('input', function () {
            const val = this.value;
            let strength = 0;
            if (val.length > 0) strength += 1;
            if (val.length >= 8) strength += 1;
            if (/[A-Z]/.test(val)) strength += 1;
            if (/[0-9]/.test(val)) strength += 1;
            if (/[^A-Za-z0-9]/.test(val)) strength += 1;
            if (val.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.textContent = '';
            } else if (strength <= 2) {
                strengthBar.style.width = '33%';
                strengthBar.className = 'h-full bg-error strength-meter-fill';
                strengthText.textContent = 'Weak';
                strengthText.className = 'font-body-sm text-xs text-error mt-1';
            } else if (strength <= 4) {
                strengthBar.style.width = '66%';
                strengthBar.className = 'h-full bg-[#f59e0b] strength-meter-fill'; // Amber for medium
                strengthText.textContent = 'Good';
                strengthText.className = 'font-body-sm text-xs text-[#f59e0b] mt-1';
            } else {
                strengthBar.style.width = '100%';
                strengthBar.className = 'h-full bg-secondary strength-meter-fill';
                strengthText.textContent = 'Strong';
                strengthText.className = 'font-body-sm text-xs text-secondary mt-1';
            }
        });
    </script>
